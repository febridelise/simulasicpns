<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses Terkunci - SANG PNS Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-lock {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 50px 30px 40px;
            border-radius: 28px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(239, 68, 68, 0.1);
            animation: shakeIntro 0.6s ease-in-out;
        }

        .icon-wrapper {
            width: 90px;
            height: 90px;
            background: rgba(239, 68, 68, 0.1);
            border: 2px dashed #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
        }

        .lock-svg {
            width: 42px;
            height: 42px;
            fill: #fca5a5;
            animation: pulseGlow 2s infinite;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fca5a5;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .price-tag {
            background: linear-gradient(90deg, #ef4444, #b91c1c);
            color: white;
            padding: 6px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 800;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
            letter-spacing: 0.5px;
        }

        .info-text {
            font-size: 1rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .info-text strong {
            color: #f1f5f9;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            color: #0f172a;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 30px;
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.5);
            filter: brightness(1.1);
        }

        .btn-action:active {
            transform: translateY(-1px);
        }

        /* Bagian Keterangan Hak Cipta & Info Baru */
        .footer-secure {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 25px;
            margin-top: 10px;
        }

        .copyright {
            font-size: 0.85rem;
            color: #475569;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .brand-name {
            font-size: 0.75rem;
            color: #38bdf8;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 8px #ef4444); }
            100% { transform: scale(1); opacity: 0.9; }
        }

        @keyframes shakeIntro {
            0% { transform: translateY(20px); opacity: 0; }
            50% { transform: translateY(-2px); opacity: 1; }
            70% { transform: translateX(-4px); }
            90% { transform: translateX(4px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

    <div class="card-lock">
        <!-- Ikon Proteksi Keamanan -->
        <div class="icon-wrapper">
            <svg class="lock-svg" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>
        
        <!-- Pesan Status -->
        <h1>SISTEM TERKUNCI</h1>
        <div class="price-tag">PREMIUM Rp12.000</div>
        
        <p class="info-text">
            Akses Premium Materi simulasi Tes CPNS. Cukup bayar satu kali, Anda akan mendapatkan <strong>Full Akses Kunci untuk Paket 13 sampai Paket 40</strong> selamanya.
        </p>

        <!-- Tombol Transaksi Langsung Lempar ke WA -->
        <a href="https://wa.me." target="_blank" class="btn-action">
            Beli Akses Premium Sekarang
        </a>
        
        <!-- Hak Cipta Baru yang Menggantikan Tombol Kembali -->
        <div class="footer-secure">
            <p class="copyright">Copyright © Febri Delise 2026</p>
            <p class="brand-name">INDONESIUM • SANG PNS</p>
        </div>
    </div>

</body>
</html>
